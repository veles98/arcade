<title>٥٠ درجة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&display=swap">
<style>
/* One full-screen canvas game: keep the house cool by switching the ACs back on */
html,body{height:100%;margin:0;background:var(--stage,#050507);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c" aria-label="لعبة ٥٠ درجة: شغّل المكيفات قبل لا تولّع الحرارة"></canvas>
<script>
(() => {
const Q = new URLSearchParams(location.search), CAP = Q.has('capture'), STOP_AT = +(Q.get('stopAt') || 40);
{ let s = (+Q.get('seed') || 50) >>> 0; if (CAP || Q.has('seed'))
  Math.random = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const cv = document.getElementById('c'), cx = cv.getContext('2d');
const GOLD = '#f3c766', FG = '#f5f2ea', MUTE = '#8a8a92', BG = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#050507', ICE = '#8fd3ff', HOT = '#ff6a3d', RED = '#e0574a';
const FONT = '"Alexandria", system-ui, sans-serif';
let W, H, S;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); S = Math.min(W / 400, H / 720);
}
addEventListener('resize', resize); resize();
const X = v => v * S + (W - 400 * S) / 2, Y = v => v * S + (H - 720 * S) / 2, L = v => v * S;

// 3 x 4 windows, each with an AC unit
const COLS = [95, 200, 305], ROWS = [250, 340, 430, 520];
const units = [];
for (const y of ROWS) for (const x of COLS) units.push({ x, y, on: true, off: 0, broke: false, hit: 0 });

let state = 'menu', temp, score, best = 0, t = 0, overAt = 0, spawnT, combo, pops, shake, sun, cutT, cut, newBest;
try { best = +localStorage.getItem('hot_best') || 0 } catch (e) {}
function reset() {
  temp = 30; score = 0; spawnT = 1.2; combo = 0; pops = []; shake = 0; sun = 0; cutT = 14; cut = 0; newBest = false;
  for (const u of units) { u.on = true; u.off = 0; u.broke = false; u.hit = 0; }
}
reset();

let ac = null, muted = false;
function blip(f, d, type = 'sine', v = 0.05) {
  if (muted || CAP) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {}
}

function tapAt(px, py) {
  if (state !== 'play') return;
  let best = null, bd = 1e9;
  for (const u of units) { const d = Math.hypot(u.x - px, u.y - py); if (d < bd) { bd = d; best = u; } }
  if (!best || bd > 52) return;
  const u = best;
  if (u.broke) { temp += 3; combo = 0; shake = 0.25; u.hit = 0.3; blip(120, 0.25, 'sawtooth', 0.06);
    pops.push({ x: u.x, y: u.y - 30, s: 'خربان!', c: RED, t: 0 }); return; }
  if (!u.on) { u.on = true; u.off = 0; combo++; score += combo >= 6 ? 2 : 1; temp = Math.max(24, temp - 0.7); u.hit = 0.3;
    blip(520 + combo * 30, 0.08, 'triangle');
    if (combo === 6) pops.push({ x: u.x, y: u.y - 34, s: 'برّدت!', c: ICE, t: 0 }); }
}
function pointer(e) {
  const r = cv.getBoundingClientRect();
  return [((e.clientX - r.left) - (W - 400 * S) / 2) / S, ((e.clientY - r.top) - (H - 720 * S) / 2) / S];
}
addEventListener('pointerdown', e => {
  e.preventDefault();
  const [px, py] = pointer(e);
  if (px > 350 && py < 60) { muted = !muted; return; }
  if (state === 'menu') { state = 'play'; reset(); return; }
  if (state === 'over') { if (t - overAt > 0.6) { state = 'play'; reset(); } return; }
  tapAt(px, py);
}, { passive: false });
addEventListener('keydown', e => { if (e.code === 'Space' && state !== 'play') { state = 'play'; reset(); } });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

function update(dt) {
  t += dt;
  pops = pops.filter(p => (p.t += dt) < 0.9);
  shake = Math.max(0, shake - dt);
  for (const u of units) u.hit = Math.max(0, u.hit - dt);
  if (state !== 'play') return;
  const lvl = 1 + score / 30;
  // ACs trip off one by one; some come back broken (don't touch those)
  spawnT -= dt;
  if (spawnT <= 0) {
    const live = units.filter(u => u.on && !u.broke);
    if (live.length) {
      const u = live[Math.floor(Math.random() * live.length)];
      if (score > 8 && Math.random() < 0.16) { u.broke = true; u.on = false; u.off = 0; }
      else { u.on = false; u.off = 0; }
    }
    spawnT = Math.max(0.38, 1.15 / lvl);
  }
  for (const u of units) {
    if (u.broke) { u.off += dt; if (u.off > 2.6) { u.broke = false; u.on = true; u.off = 0; } }
    else if (!u.on) u.off += dt;
  }
  // power cut every ~14 s: every AC drops at once for a moment
  cutT -= dt;
  if (cutT <= 0 && score > 10) { cut = 0.7; cutT = 14; for (const u of units) if (!u.broke) { u.on = false; u.off = 0; }
    pops.push({ x: 200, y: 600, s: 'انقطعت الكهربا!', c: GOLD, t: 0 }); blip(90, 0.5, 'square', 0.05); }
  cut = Math.max(0, cut - dt);
  const offN = units.filter(u => !u.on && !u.broke).length;
  temp += (offN * 0.8 - 0.5) * dt * (0.8 + lvl * 0.25);
  temp = Math.max(24, temp);
  sun += dt;
  if (temp >= 50) {
    state = 'over'; overAt = t; shake = 0.4; blip(70, 0.6, 'sawtooth', 0.07);
    if (score > best) { best = score; newBest = true; try { localStorage.setItem('hot_best', best) } catch (e) {} }
  }
}

function text(s, x, y, size, color, w = 800) {
  cx.direction = 'rtl'; cx.font = `${w} ${L(size)}px ${FONT}`; cx.fillStyle = color; cx.textAlign = 'center'; cx.fillText(s, X(x), Y(y));
}
function ar(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function drawUnit(u) {
  const x = X(u.x), y = Y(u.y), w = L(70), h = L(40);
  cx.save();
  const pulse = u.hit ? 1 + u.hit * 0.25 : 1;
  cx.translate(x, y); cx.scale(pulse, pulse);
  // window frame
  cx.strokeStyle = 'rgba(243,199,102,0.25)'; cx.lineWidth = L(1.5); cx.strokeRect(-L(44), -L(38), L(88), L(76));
  // unit body
  const col = u.broke ? RED : u.on ? ICE : HOT;
  cx.shadowColor = col; cx.shadowBlur = u.on ? L(10) : L(18 + 8 * Math.sin(t * 12));
  cx.strokeStyle = col; cx.lineWidth = L(2.5);
  cx.fillStyle = u.on ? 'rgba(143,211,255,0.10)' : u.broke ? 'rgba(224,87,74,0.14)' : 'rgba(255,106,61,0.16)';
  cx.beginPath(); cx.roundRect(-w / 2, -h / 2, w, h, L(6)); cx.fill(); cx.stroke();
  cx.shadowBlur = 0;
  // vents
  for (let i = -2; i <= 2; i++) { cx.beginPath(); cx.moveTo(-w / 2 + L(8), i * L(5)); cx.lineTo(w / 2 - L(22), i * L(5)); cx.stroke(); }
  cx.beginPath(); cx.arc(w / 2 - L(12), 0, L(7), 0, 7); cx.stroke();
  if (u.on) { // cold air
    cx.globalAlpha = 0.5; cx.strokeStyle = ICE; cx.lineWidth = L(1.5);
    for (let i = 0; i < 3; i++) { const o = ((t * 30 + i * 9) % 26); cx.beginPath(); cx.moveTo(-L(20) + i * L(18), h / 2 + L(4) + o * S * 0.4);
      cx.lineTo(-L(24) + i * L(18), h / 2 + L(10) + o * S * 0.4); cx.stroke(); }
    cx.globalAlpha = 1;
  } else if (u.broke) {
    cx.strokeStyle = RED; cx.lineWidth = L(3); cx.beginPath(); cx.moveTo(-L(10), -L(10)); cx.lineTo(L(10), L(10)); cx.moveTo(L(10), -L(10)); cx.lineTo(-L(10), L(10)); cx.stroke();
  } else { // heat shimmer
    cx.globalAlpha = 0.7; cx.strokeStyle = HOT; cx.lineWidth = L(1.8);
    for (let i = -1; i <= 1; i++) { cx.beginPath(); const bx = i * L(16);
      for (let k = 0; k <= 8; k++) { const yy = -h / 2 - L(4) - k * L(2.6); const xx = bx + Math.sin(t * 9 + k + i) * L(3); k ? cx.lineTo(xx, yy) : cx.moveTo(xx, yy); } cx.stroke(); }
    cx.globalAlpha = 1;
  }
  cx.restore();
}
function draw() {
  const sx = shake ? (Math.random() - 0.5) * L(10) * shake : 0, sy = shake ? (Math.random() - 0.5) * L(10) * shake : 0;
  cx.setTransform(1, 0, 0, 1, 0, 0); const d = Math.min(devicePixelRatio || 1, 2); cx.setTransform(d, 0, 0, d, sx * d, sy * d);
  const heat = Math.max(0, Math.min(1, (temp - 30) / 20));
  cx.fillStyle = BG; cx.fillRect(-20, -20, W + 40, H + 40);
  const g = cx.createRadialGradient(W / 2, Y(120), 10, W / 2, Y(120), H * 0.9);
  g.addColorStop(0, `rgba(${243 + 12 * heat},${199 - 110 * heat},${102 - 60 * heat},${0.16 + 0.22 * heat})`); g.addColorStop(1, 'rgba(5,5,7,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  // sun
  cx.save(); cx.translate(X(200), Y(120)); cx.rotate(sun * 0.3);
  cx.strokeStyle = heat > 0.6 ? HOT : GOLD; cx.lineWidth = L(2.5); cx.shadowColor = cx.strokeStyle; cx.shadowBlur = L(14);
  cx.beginPath(); cx.arc(0, 0, L(26), 0, 7); cx.stroke();
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; cx.beginPath(); cx.moveTo(Math.cos(a) * L(34), Math.sin(a) * L(34)); cx.lineTo(Math.cos(a) * L(46), Math.sin(a) * L(46)); cx.stroke(); }
  cx.restore();
  // building
  cx.strokeStyle = 'rgba(243,199,102,0.55)'; cx.lineWidth = L(2); cx.strokeRect(X(30), Y(195), L(340), L(385));
  cx.beginPath(); cx.moveTo(X(20), Y(195)); cx.lineTo(X(380), Y(195)); cx.stroke();
  cx.beginPath(); cx.moveTo(X(0), Y(580)); cx.lineTo(X(400), Y(580)); cx.stroke();
  if (cut) { cx.fillStyle = `rgba(0,0,0,${0.5 * cut})`; cx.fillRect(0, 0, W, H); }
  for (const u of units) drawUnit(u);
  // thermometer
  const tx = X(200), ty = Y(640), tw = L(300);
  cx.strokeStyle = 'rgba(245,242,234,0.25)'; cx.lineWidth = L(10); cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(tx - tw / 2, ty); cx.lineTo(tx + tw / 2, ty); cx.stroke();
  const k = Math.max(0, Math.min(1, (temp - 24) / 26));
  cx.strokeStyle = k > 0.7 ? HOT : k > 0.4 ? GOLD : ICE; cx.shadowColor = cx.strokeStyle; cx.shadowBlur = L(12);
  cx.beginPath(); cx.moveTo(tx + tw / 2, ty); cx.lineTo(tx + tw / 2 - tw * k, ty); cx.stroke(); cx.shadowBlur = 0; cx.lineCap = 'butt';
  text(ar(Math.floor(temp)) + '°', 200, 685, 26, k > 0.7 ? HOT : FG);
  for (const p of pops) { cx.globalAlpha = 1 - p.t / 0.9; text(p.s, p.x, p.y - p.t * 40, 22, p.c); cx.globalAlpha = 1; }
  text(muted ? '🔇' : '🔊', 375, 40, 18, MUTE, 700);
  if (state === 'play') { text(ar(score), 200, 70, 46, FG); if (combo >= 6) text('×٢', 260, 70, 20, ICE); }
  if (state === 'menu') {
    cx.fillStyle = 'rgba(5,5,7,0.72)'; cx.fillRect(0, 0, W, H);
    text('٥٠ درجة', 200, 250, 62, GOLD);
    text('المكيفات تطفي وحدة ورا الثانية', 200, 305, 19, FG, 700);
    text('اضغط على البرتقالي عشان يشتغل', 200, 335, 19, FG, 700);
    text('ولا تلمس الأحمر الخربان', 200, 365, 16, MUTE, 700);
    if (best) text('أفضل نتيجة: ' + ar(best), 200, 520, 18, GOLD, 700);
    text('اضغط عشان تبدأ', 200, 460, 22, FG);
    text('سوّاها Claude · anas.ai.ar', 200, 705, 12, MUTE, 700);
  }
  if (state === 'over') {
    cx.fillStyle = 'rgba(5,5,7,0.74)'; cx.fillRect(0, 0, W, H);
    text('ولّعت!', 200, 240, 56, HOT);
    text('النتيجة: ' + ar(score), 200, 300, 28, FG);
    text(newBest ? 'رقم قياسي جديد!' : 'أفضل نتيجة: ' + ar(best), 200, 338, 18, newBest ? GOLD : MUTE, 700);
    if (t - overAt > 0.6) text('اضغط عشان تعيد', 200, 420, 22, FG);
    text('صوّر نتيجتك وحطها بالتعليقات', 200, 470, 15, GOLD, 700);
  }
}

// autopilot for the reel capture (?capture or ?bot); it stops trying at STOP_AT so the round ends
function bot() {
  if (state !== 'play') return;
  bot.cd = (bot.cd || 0) - 1;
  if (bot.cd > 0) return;
  if (score >= STOP_AT) return;
  const off = units.filter(u => !u.on && !u.broke && u.off > 0.3).sort((a, b) => b.off - a.off);
  if (off.length) { tapAt(off[0].x, off[0].y); bot.cd = 7 + Math.floor(Math.random() * 4); }
}
window.__step = dt => { bot(); update(dt); draw(); return { state, score, temp, pops: pops.filter(p => p.t === 0).map(p => p.s) }; };
window.__start = () => { state = 'play'; reset(); };
let last = performance.now();
if (!CAP) {
  const autoplay = Q.has('bot');
  (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (autoplay) bot(); update(dt); draw(); requestAnimationFrame(loop); })(last);
} else { update(0); draw(); }
})();
</script>

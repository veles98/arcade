<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a3cff">
<title>سيف الدين</title>
<meta name="description" content="اسحب إصبعك وقطّع كل شي يطير، وابعد عن المنبّه الأحمر.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Lalezar&display=swap">
<style>
:root{--ink:#2a1d4a;--y:#ffd23f;--p:#ff4f9a;--b:#2fb7ff;--o:#ff8a1f}
html,body{height:100%;margin:0;background:#6a3cff;color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Alexandria",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center;background:rgba(42,29,74,.35)}
.ui.on{display:flex}
.ui.on>*{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.ui.on>*:nth-child(2){animation-delay:.05s}.ui.on>*:nth-child(3){animation-delay:.1s}.ui.on>*:nth-child(4){animation-delay:.15s}.ui.on>*:nth-child(5){animation-delay:.2s}.ui.on>*:nth-child(6){animation-delay:.25s}.ui.on>*:nth-child(7){animation-delay:.3s}
@keyframes pop{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.05)}}
h1{font-family:"Lalezar",sans-serif;font-size:84px;margin:0;font-weight:400;line-height:1.05;color:var(--y);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
#sMenu.on h1{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,bob 1.8s ease-in-out .5s infinite}
h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:40px;margin:0;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
p{margin:0;font-size:16px;font-weight:700;line-height:1.6;max-width:330px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.small{font-size:13px}
button{font:inherit;font-weight:800;font-size:20px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:26px;padding:13px 18px;width:min(310px,100%);cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 var(--ink)}
button .sub{display:block;font-size:12px;font-weight:600;opacity:.92;margin-top:2px}
.gold{background:linear-gradient(180deg,#ffe066,#ffb000);color:var(--ink)}
.pink{background:linear-gradient(180deg,#ff7ab5,#ff3d8a);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.blue{background:linear-gradient(180deg,#5fd0ff,#2398e0);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.mute{font-size:14px;padding:8px 14px;width:auto;border-radius:18px;box-shadow:0 4px 0 var(--ink);background:var(--y)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
a.hub{color:#fff;font-size:13px;font-weight:700;text-decoration:none;border-bottom:2px solid #fff}
.gift{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:#fff}
.gift svg{width:16px;height:16px}
.big{font-family:"Lalezar",sans-serif;font-size:96px;line-height:1;color:var(--y);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.rank{font-family:"Lalezar",sans-serif;font-size:30px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:6px 22px;box-shadow:0 5px 0 var(--ink);color:#ff3d8a}
.ranks{display:flex;gap:6px;font-size:12px;font-weight:700;color:#fff}
.ranks span{padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.15)}
.ranks span.on{background:var(--y);color:var(--ink)}
.stats{display:flex;gap:10px}
.stat{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700;min-width:70px}
.stat b{display:block;font-size:22px;font-family:"Lalezar",sans-serif;font-weight:400;color:#7b3cff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui on" id="sMenu">
  <h1 id="title"></h1>
  <p>اسحب إصبعك وقطّع كل شي يطير. قطّع ٣ بضربة وحدة عشان الكومبو، وابعد عن المنبّه الأحمر.</p>
  <button class="gold" data-go="timed">جولة ٦٠ ثانية<span class="sub">أعلى نتيجة قبل ما يخلص الوقت</span></button>
  <button class="pink" data-go="endless">بلا نهاية<span class="sub">٣ أرواح، وكل شي يطيح منك يخصم روح</span></button>
  <p class="small" id="bestLine"></p>
  <div class="gift" id="gift"></div>
  <div class="row"><button class="mute" id="muteBtn">الصوت: شغّال</button><a class="hub" href="../">ألعاب ومشاريع أنس</a></div>
</div>
<div class="ui" id="sOver">
  <h2 id="overTitle">خلصت الجولة</h2>
  <div class="big" id="overScore">٠</div>
  <div class="rank" id="overRank"></div>
  <div class="ranks" id="ranksRow"></div>
  <div class="stats"><div class="stat">قطّعت<b id="stCut">٠</b></div><div class="stat">أكبر كومبو<b id="stCombo">٠</b></div><div class="stat">أفضل نتيجة<b id="stBest">٠</b></div></div>
  <button class="gold" id="againBtn">مرة ثانية</button>
  <button class="blue" id="shareBtn">صورة النتيجة</button>
  <button id="menuBtn" style="font-size:16px;padding:9px">القائمة</button>
</div>
<script>
// ===== One constant: swap the name here if the gift is declined. It drives the title, the credit and the top rank. =====
const GIFT_NAME = 'سيف الدين';

const Q = new URLSearchParams(location.search);
const CAP = Q.has('capture');                  // frames stepped by window.__step(dt); audio logged for __renderAudio
let seed = +(Q.get('seed') || 0) || (Date.now() % 100000);
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rnd();
const AR = n => String(Math.round(n)).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const $ = id => document.getElementById(id);
const OUT = '#2a1d4a', FONT = '"Lalezar","Alexandria",sans-serif';
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#fff"/></svg>';
$('title').textContent = GIFT_NAME;
$('gift').innerHTML = 'مهداة لـ' + GIFT_NAME + '، المتابع رقم ١٠٠ ' + HEART;
const RANKS = [['مبتدئ', 0], ['سيّاف', 40], [GIFT_NAME, 100]];
const rankOf = s => { let r = 0; RANKS.forEach((k, i) => { if (s >= k[1]) r = i; }); return r; };

/* ---------------- audio (same frame-clock method as sarrikh) ---------------- */
let AC = null, OUTN = null, MUS = null, SFXG = null, muted = false;
try { muted = localStorage.getItem('saif_muted') === '1'; } catch (e) {}
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); OUTN = AC.createGain(); OUTN.gain.value = muted ? 0 : 1; OUTN.connect(AC.destination);
  MUS = AC.createGain(); MUS.gain.value = 0.26; MUS.connect(OUTN); SFXG = AC.createGain(); SFXG.gain.value = 0.9; SFXG.connect(OUTN); } if (AC.state === 'suspended') AC.resume(); return AC; }
const NB = new WeakMap();
function noise(c) { if (!NB.has(c)) { const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); let s = 7; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823 - 1; } NB.set(c, b); } return NB.get(c); }
function osc(c, out, t, type, f0, f1, d, v, a = 0.005) { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(out); o.start(t); o.stop(t + d + 0.05); }
function nz(c, out, t, d, v, type, f, q = 1, f1, a = 0.005) { const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = noise(c); s.loop = true;
  fl.type = type; fl.frequency.setValueAtTime(f, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d); fl.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl).connect(g).connect(out); s.start(t, (t * 7.3) % 0.5); s.stop(t + d + 0.05); }
const SFX = {
  click: (c, o, t) => { osc(c, o, t, 'sine', 600, 1100, 0.07, 0.25); osc(c, o, t + 0.03, 'triangle', 1400, 1800, 0.05, 0.1); },
  whoosh: (c, o, t, k = 1) => { nz(c, o, t, 0.22, 0.22 * k, 'bandpass', 500, 1.2, 3200, 0.04); },
  slice: (c, o, t, n = 0) => { nz(c, o, t, 0.09, 0.4, 'highpass', 3000); const f = 300 * Math.pow(1.12, n); osc(c, o, t, 'sine', f * 2, f, 0.12, 0.3); nz(c, o, t + 0.02, 0.18, 0.35, 'lowpass', 1400, 1, 300); },
  clink: (c, o, t) => { nz(c, o, t, 0.06, 0.3, 'highpass', 4000); [2100, 3170, 4300].forEach(f => osc(c, o, t, 'sine', f, f * 0.99, 0.35, 0.08)); },
  zap: (c, o, t) => { nz(c, o, t, 0.06, 0.3, 'highpass', 4000); osc(c, o, t, 'square', 1800, 300, 0.18, 0.08); osc(c, o, t + 0.05, 'square', 1200, 200, 0.15, 0.06); },
  coin: (c, o, t) => { osc(c, o, t, 'square', 988, 988, 0.07, 0.09); osc(c, o, t + 0.07, 'square', 1319, 1319, 0.2, 0.09); osc(c, o, t + 0.07, 'sine', 2637, 2637, 0.3, 0.06); },
  combo: (c, o, t, n = 3) => { [523, 659, 784, 1047, 1319, 1568].slice(0, Math.min(6, n + 1)).forEach((f, i) => { osc(c, o, t + i * 0.06, 'triangle', f, f, 0.3, 0.16); osc(c, o, t + i * 0.06, 'sine', f * 2, f * 2, 0.25, 0.06); });
    nz(c, o, t, 0.8, 0.08, 'highpass', 6000); },
  boom: (c, o, t) => { osc(c, o, t, 'sine', 120, 30, 0.8, 1.0); nz(c, o, t, 1.1, 0.8, 'lowpass', 2500, 0.7, 120); nz(c, o, t, 0.15, 0.5, 'highpass', 2000); },
  ring: (c, o, t) => { for (let i = 0; i < 6; i++) osc(c, o, t + i * 0.05, 'square', 2400, 2400, 0.04, 0.05); },
  miss: (c, o, t) => { osc(c, o, t, 'triangle', 300, 120, 0.3, 0.3); },
  tick: (c, o, t, k) => { osc(c, o, t, 'sine', k ? 1320 : 880, k ? 1320 : 880, k ? 0.35 : 0.1, 0.25); },
  go: (c, o, t) => { [523, 659, 784, 1047].forEach((f, i) => osc(c, o, t + i * 0.07, 'square', f, f, 0.14, 0.09)); nz(c, o, t, 0.4, 0.15, 'bandpass', 2500, 0.7); SFX.whoosh(c, o, t + 0.25, 1.4); },
  over: (c, o, t) => { [784, 659, 523, 392].forEach((f, i) => osc(c, o, t + i * 0.12, 'triangle', f, f, 0.2, 0.15)); },
  fanfare: (c, o, t) => { [523, 659, 784, 1047].forEach((f, i) => { osc(c, o, t + i * 0.09, 'square', f, f, 0.14, 0.1); }); [1047, 1319, 1568].forEach(f => osc(c, o, t + 0.36, 'square', f, f, 0.6, 0.07)); },

// upbeat loop, 128 bpm (A minor pentatonic pluck over four-on-the-floor)
const BPM = 128, BEAT = 60 / BPM;
const CH = [[45, 52, 60], [41, 48, 57], [43, 50, 59], [40, 47, 55]];
const MEL = [81, -1, 79, 76, 79, -1, 84, 81, 76, -1, 79, 81, 76, 74, -1, 72, 74, -1, 76, 79, 81, 79, 76, -1, 79, -1, 76, 74, 72, -1, 74, 76];
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function musicBar(c, o, t, bar) { const ch = CH[bar % 4];
  for (let b = 0; b < 4; b++) { const tb = t + b * BEAT; osc(c, o, tb, 'sine', 150, 45, 0.2, 0.9); if (b & 1) nz(c, o, tb, 0.12, 0.3, 'bandpass', 1600, 0.9);
    nz(c, o, tb + BEAT / 2, 0.04, 0.16, 'highpass', 7000); osc(c, o, tb + BEAT / 2, 'triangle', mf(ch[0] - 12), mf(ch[0] - 12), BEAT * 0.45, 0.4);
    for (const n of ch) osc(c, o, tb, 'triangle', mf(n), mf(n), BEAT * 0.3, 0.04); }
  for (let i = 0; i < 8; i++) { const n = MEL[(bar % 4) * 8 + i]; if (n > 0) { const tt = t + i * BEAT / 2; osc(c, o, tt, 'square', mf(n), mf(n), BEAT * 0.35, 0.05); osc(c, o, tt, 'sine', mf(n), mf(n), BEAT * 0.4, 0.06); } } }
let musNext = 0, musBar = 0, musOn = false;
setInterval(() => { if (!AC || !musOn || CAP) return; while (musNext < AC.currentTime + 0.6) { if (musNext < AC.currentTime) musNext = AC.currentTime + 0.05; musicBar(AC, MUS, musNext, musBar++); musNext += BEAT * 4; } }, 150);
const LOG = []; let CLOCK = 0;
function musicStart() { if (CAP) { LOG.push({ t: CLOCK, n: 'music' }); return; } if (!musOn) { musOn = true; if (AC) musNext = AC.currentTime + 0.05; } }
function musicSlow(on) { if (CAP) { LOG.push({ t: CLOCK, n: 'duck', a: on ? 0.08 : 0.26 }); return; } if (MUS) MUS.gain.setTargetAtTime(on ? 0.08 : 0.26, AC.currentTime, 0.05); }
function sfx(name, arg) { if (CAP) { LOG.push({ t: CLOCK, n: name, a: arg }); return; } if (muted) return; try { const c = ac(); SFX[name](c, SFXG, c.currentTime + 0.005, arg); } catch (e) {} }
window.__renderAudio = async (dur) => {
  const c = new OfflineAudioContext(2, Math.ceil(44100 * dur), 44100); const out = c.createGain(); out.connect(c.destination);
  const mus = c.createGain(); mus.gain.value = 0; mus.connect(out); const fx = c.createGain(); fx.gain.value = 0.9; fx.connect(out);
  const m0 = LOG.find(e => e.n === 'music'); if (m0) { mus.gain.setValueAtTime(0.26, m0.t); let bar = 0; for (let t = m0.t; t < dur; t += BEAT * 4) musicBar(c, mus, t, bar++); }
  for (const e of LOG) { if (e.t >= dur) continue; if (e.n === 'duck') mus.gain.setTargetAtTime(e.a, e.t, 0.05); else if (SFX[e.n]) SFX[e.n](c, fx, e.t + 0.005, e.a); }
  const buf = await c.startRendering(); const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  const n = L.length, ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab); const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, 44100, true); v.setUint32(28, 44100 * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * 0.8)) * 32767, true); v.setInt16(46 + i * 4, Math.max(-1, Math.min(1, Rr[i] * 0.8)) * 32767, true); }
  let s = ''; const u = new Uint8Array(ab); for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s);

window.__LOG = LOG;
function setMuted(m) { muted = m; try { localStorage.setItem('saif_muted', m ? '1' : '0'); } catch (e) {} if (OUTN) OUTN.gain.value = m ? 0 : 1; $('muteBtn').textContent = m ? 'الصوت: مطفي' : 'الصوت: شغّال'; }
const buzz = p => { if (CAP) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------------- canvas ---------------- */
const cv = $('c'), x = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, U = 1;
function resize() { DPR = Math.min(3, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; U = Math.min(W, H * 0.6) / 360; }
addEventListener('resize', resize); resize();

/* ---------------- object art: each draws at the origin with radius 1 ---------------- */
function rr(c, X, Y, w, h, r) { c.beginPath(); c.moveTo(X + r, Y); c.arcTo(X + w, Y, X + w, Y + h, r); c.arcTo(X + w, Y + h, X, Y + h, r); c.arcTo(X, Y + h, X, Y, r); c.arcTo(X, Y, X + w, Y, r); c.closePath(); }
function ink(c, w = 0.09) { c.lineWidth = w; c.strokeStyle = OUT; c.lineJoin = 'round'; c.stroke(); }
function shine(c, X, Y, rx, ry) { c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(X, Y, rx, ry, -0.6, 0, 7); c.fill(); }
function grad(c, a, b) { const g = c.createRadialGradient(-0.35, -0.4, 0.1, 0, 0, 1.1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
const TYPES = {
  orange: { r: 30, juice: '#ff9a1f', flesh: '#ffc35a', pts: 1, snd: 'slice', draw(c) { c.beginPath(); c.arc(0, 0, 1, 0, 7); c.fillStyle = grad(c, '#ffc04d', '#ff6a00'); c.fill(); ink(c);
    c.fillStyle = 'rgba(160,60,0,.25)'; for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(Math.cos(i * 2.4) * 0.55, Math.sin(i * 2.4) * 0.55, 0.05, 0, 7); c.fill(); }
    c.beginPath(); c.ellipse(0.25, -1.02, 0.32, 0.14, -0.4, 0, 7); c.fillStyle = '#3ccf5a'; c.fill(); ink(c, 0.06); shine(c, -0.4, -0.45, 0.25, 0.13); } },
  melon: { r: 40, juice: '#ff3b5c', flesh: '#ff4f6a', pts: 1, snd: 'slice', draw(c) { c.beginPath(); c.ellipse(0, 0, 1, 0.86, 0, 0, 7); c.fillStyle = grad(c, '#5fe06a', '#1e9a3a'); c.fill();
    c.save(); c.clip(); c.strokeStyle = '#167a2c'; c.lineWidth = 0.13; for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 0.3, -1); c.quadraticCurveTo(i * 0.42, 0, i * 0.3, 1); c.stroke(); } c.restore();
    c.beginPath(); c.ellipse(0, 0, 1, 0.86, 0, 0, 7); ink(c); shine(c, -0.45, -0.4, 0.28, 0.12); } },
  date: { r: 24, juice: '#8b3a12', flesh: '#e0a050', pts: 1, snd: 'slice', draw(c) { c.beginPath(); c.ellipse(0, 0, 0.62, 1, 0, 0, 7); c.fillStyle = grad(c, '#c46a2c', '#5a220a'); c.fill(); ink(c);
    c.strokeStyle = 'rgba(40,10,0,.45)'; c.lineWidth = 0.06; c.beginPath(); c.moveTo(-0.2, -0.6); c.quadraticCurveTo(0.1, -0.2, -0.15, 0.3); c.moveTo(0.25, -0.2); c.quadraticCurveTo(0.35, 0.3, 0.15, 0.7); c.stroke();
    c.fillStyle = '#e8c070'; c.beginPath(); c.ellipse(0, -0.97, 0.18, 0.08, 0, 0, 7); c.fill(); shine(c, -0.25, -0.45, 0.12, 0.25); } },
  tea: { r: 30, juice: '#e0701a', flesh: '#c24a10', pts: 1, snd: 'clink', draw(c) { c.beginPath(); c.ellipse(0, 0.82, 1, 0.22, 0, 0, 7); c.fillStyle = '#fff'; c.fill(); ink(c, 0.07);

    x.font = `${26 * U}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = tl <= 5 ? '#fff' : OUT; x.fillText(AR(tl), W / 2, top + 2 * U); }
  for (let i = 0; i < 3; i++) { x.save(); x.translate(26 * U + i * 34 * U, top); x.rotate(-0.7); x.globalAlpha = i < lives ? 1 : 0.28; x.scale(U, U);
    x.fillStyle = OUT; x.fillRect(-3.5, -16, 7, 26); x.fillRect(-10, 6, 20, 6); x.fillStyle = i < lives ? '#ffd23f' : '#fff'; x.fillRect(-2, -14, 4, 22); x.fillRect(-8, 7.5, 16, 3); x.fillStyle = '#ff4f9a'; x.fillRect(-2, 11, 4, 8); x.restore(); } }
function drawPops() { for (const p of pops) { const k = p.t / p.life, s = k < 0.15 ? 0.4 + 4 * k : 1 + 0.05 * Math.sin(p.t * 20); x.save(); x.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1; x.translate(p.x, p.y - k * 30 * U); x.rotate(-0.06); x.scale(s, s); txt(p.s, 0, 0, p.sz, p.col); x.restore(); } }
function draw() { bgT += 1 / 60; x.setTransform(DPR, 0, 0, DPR, 0, 0); x.save(); if (shake > 0.3) x.translate(R(-shake, shake), R(-shake, shake));
  drawBG(); for (const s of splats) drawSplat(s);
  for (const h of halves) drawHalf(h); for (const o of objs) drawObj(o);
  for (const p of parts) { x.globalAlpha = 1 - p.t / p.life; x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); } x.globalAlpha = 1;
  drawTrail(); x.restore();
  if (state === 'play') drawHUD(); drawPops();
  if (slow > 0) { x.fillStyle = `rgba(255,210,63,${0.12 * slow / 0.3})`; x.fillRect(0, 0, W, H); }
  if (flash > 0) { x.fillStyle = `rgba(255,255,255,${flash * 0.8})`; x.fillRect(0, 0, W, H); } }

/* ---------------- share card ---------------- */
function shareCard() { const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; const y = c.getContext('2d');
  const g = y.createLinearGradient(0, 0, 400, 1920); g.addColorStop(0, '#5b2cff'); g.addColorStop(0.5, '#c43cff'); g.addColorStop(1, '#ff7a3d'); y.fillStyle = g; y.fillRect(0, 0, 1080, 1920);
  const t = (s, X, Y, sz, col = '#fff', st = OUT) => { y.font = `${sz}px ${FONT}`; y.textAlign = 'center'; y.textBaseline = 'middle'; y.lineJoin = 'round'; if (st) { y.lineWidth = sz * 0.2; y.strokeStyle = st; y.strokeText(s, X, Y); } y.fillStyle = col; y.fillText(s, X, Y); };
  const ks = ['orange', 'melon', 'date', 'tea', 'coffee', 'phone', 'pad', 'coin'];
  ks.forEach((k, i) => { y.save(); y.translate(i % 2 ? 900 : 180, 380 + i * 170); y.rotate(i - 2); y.scale(70, 70); TYPES[k].draw(y, 0); y.restore(); });
  t(GIFT_NAME, 540, 260, 190, '#ffd23f'); t('نتيجتي', 540, 560, 64); t(AR(score), 540, 790, 300, '#ffd23f');
  y.fillStyle = OUT; rr(y, 240, 1010, 600, 150, 60); y.fill(); y.fillStyle = '#fff'; rr(y, 240, 996, 600, 150, 60); y.fill(); y.lineWidth = 8; y.strokeStyle = OUT; y.stroke();
  t('رتبتي: ' + RANKS[rankOf(score)][0], 540, 1072, 64, '#ff3d8a', null);
  t('قطّعت ' + AR(cut) + '   أكبر كومبو ' + AR(maxCombo), 540, 1260, 54);
  t('تقدر تغلبني؟', 540, 1600, 70); y.direction = 'ltr'; t('@anas.ai.ar', 540, 1740, 84, '#ffd23f'); return c; }
$('shareBtn').onclick = () => { sfx('click'); const c = shareCard(); c.toBlob(async b => { const f = new File([b], 'saif.png', { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: 'تقدر تغلب نتيجتي؟' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'saif.png'; a.click(); }, 'image/png'); };
window.__shareCard = () => shareCard().toDataURL('image/png');

for (const b of document.querySelectorAll('[data-go]')) b.onclick = () => { sfx('click'); start(b.dataset.go); };
$('againBtn').onclick = () => { sfx('click'); start(mode); };
$('menuBtn').onclick = () => { sfx('click'); state = 'menu'; objs = []; showUI('sMenu'); };
$('muteBtn').onclick = () => { setMuted(!muted); ac_ok(); sfx('click'); }; setMuted(muted);

window.__state = () => ({ state, score, lives, timeLeft, combo: maxCombo, cut, objs: objs.filter(o => !o.menu).map(o => ({ k: o.kind, x: o.x, y: o.y, vx: o.vx, vy: o.vy, r: o.r })) });
if (CAP) window.__step = dt => { step(dt); draw(); return window.__state(); };
else { let last = performance.now(); const loop = now => { step((now - last) / 1000); last = now; draw(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>

<style>
section.sk{padding:20px 18px 18px;margin:0 0 16px;scroll-margin-top:16px}
section.sk:target{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.sk h2{font-family:Alexandria,sans-serif;font-weight:800;font-size:22px;line-height:1.4;margin:0 0 4px}
.sk .s{color:var(--mute);margin:0 0 16px;font-size:15px;line-height:1.7}
.get{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:14px;background:var(--gold);color:var(--gold-ink);font:800 18px Alexandria,sans-serif;text-decoration:none}
.get small{font:600 13px "IBM Plex Sans Arabic",system-ui;opacity:.75}
ol{margin:16px 0 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:8px}
ol li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;background:var(--code-bg);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
ol li::before{content:counter(n);flex:0 0 26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:800 14px Alexandria,sans-serif;margin-top:1px}
ol li a{color:var(--gold-text);font-weight:600}
.alt{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--edge);border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.alt span{flex:1;line-height:1.6}

	<head>
		<meta charset="utf-8">

		<meta name="theme-color" content="#eee7d6">
		<meta property="og:title" content="جسر الحبر">
		<meta property="og:description" content="لعبة مبارزة بالحبر: رونين، جسر، وظلّ ساموراي. تُلعب من الهاتف بلا تحميل.">
		<title>جسر الحبر</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { height: 100%; }
body {
	color: #121113;
	background-color: #eee7d6;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: "Alexandria", "IBM Plex Sans Arabic", "Noto Sans Arabic", "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

/* Loading screen: the same paper, sun, lettering and ink line as the game's first card,
   so the hand-over from this page to the game is not seen. Content stays inside the notch
   and home-bar areas, and inside 6% top and bottom margins. */
#status {
	position: absolute; inset: 0;
	box-sizing: border-box;
	background-color: #eee7d6;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	text-align: center;
	padding-top: max(6vh, env(safe-area-inset-top));
	padding-bottom: max(6vh, env(safe-area-inset-bottom));
	padding-left: max(24px, env(safe-area-inset-left));
	padding-right: max(24px, env(safe-area-inset-right));
	transition: opacity .35s ease;
}
#status.done { opacity: 0; pointer-events: none; }
#sun {
	width: min(24vw, 13vh, 130px); height: min(24vw, 13vh, 130px);
	border-radius: 50%; background: #c71a12; opacity: .94;
}
#title {
	margin: min(3vh, 22px) 0 0 0;
	width: min(62vw, 34vh, 320px); height: auto; display: block;
}
#rule { width: min(40vw, 22vh, 200px); height: 5px; border-radius: 3px; background: #121113; margin-top: min(2.4vh, 18px); }
#story {
	margin: min(5vh, 40px) 0 0 0;
	max-width: 22em;
	font-size: clamp(16px, 4.6vw, 21px); line-height: 1.8; font-weight: 500;
}
#brush { width: min(78vw, 360px); height: auto; margin-top: min(4vh, 30px); display: block; overflow: visible; }
#state {
	margin: 10px 0 0 0;
	font-size: clamp(14px, 3.8vw, 17px); opacity: .72;
	display: flex; gap: .6em; justify-content: center; align-items: baseline;
}
#pct { direction: ltr; unicode-bidi: isolate; font-weight: 700; color: #c71a12; opacity: 1; font-variant-numeric: lining-nums tabular-nums; }
#notice { display: none; font-size: 16px; line-height: 1.8; max-width: 22em; margin-top: 18px; }
#notice a { color: #c71a12; font-weight: 700; }

/* A phone held sideways is short: the loading card tightens up so nothing is cut. */
@media (orientation: landscape) and (max-height: 520px) {
	#status { padding-top: max(3vh, env(safe-area-inset-top)); padding-bottom: max(3vh, env(safe-area-inset-bottom)); }
	#sun { width: min(13vh, 60px); height: min(13vh, 60px); }
	#title { margin-top: 1.5vh; width: auto; height: min(24vh, 100px); }
	#rule { margin-top: 1.5vh; height: 4px; }
	#story { margin-top: 3vh; font-size: clamp(14px, 4.6vh, 19px); max-width: 34em; line-height: 1.5; }
	#brush { margin-top: 2.5vh; width: min(60vw, 340px); }
	#state { margin-top: 4px; font-size: clamp(13px, 4vh, 16px); }
}

/* v6.2: the game is played with the phone held sideways. A phone held upright gets this
   card over the (blurred) game; the engine pauses a running fight while it shows. */
#rotate {
	position: fixed; inset: 0; z-index: 30;
	box-sizing: border-box;
	display: none; flex-direction: column; justify-content: center; align-items: center;
	text-align: center;
	padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
	background-color: rgba(238, 231, 214, .46);
	-webkit-backdrop-filter: blur(11px) saturate(.9);
	backdrop-filter: blur(11px) saturate(.9);
}
#rotate.on { display: flex; }
#rotate svg { width: min(46vw, 210px); height: auto; overflow: visible; }
#rotate .phone { transform-box: fill-box; transform-origin: 50% 50%; animation: inkturn 2.6s cubic-bezier(.6, 0, .3, 1) infinite; }
@keyframes inkturn {
	0%, 18% { transform: rotate(0deg); }
	52%, 86% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
#rotbtns { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; width: min(78vw, 320px); }
#rotbtns a, #rotbtns button { display: block; box-sizing: border-box; width: 100%; padding: 14px 10px; border-radius: 12px; font: inherit; font-size: clamp(16px, 4.6vw, 20px); font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
#openext { background: #c71a12; color: #f3efe6; border: 0; }
#playup { background: transparent; color: inherit; border: 3px solid currentColor; }
#openext[hidden] { display: none; }
#rotate h2 { margin: 26px 0 0 0; font-size: clamp(26px, 8.4vw, 40px); font-weight: 800; line-height: 1.4; }
#rotate p { margin: 10px 0 0 0; font-size: clamp(15px, 4.4vw, 19px); opacity: .75; line-height: 1.7; max-width: 18em; }
#rotate .bar { width: min(34vw, 150px); height: 5px; border-radius: 3px; background: #c71a12; margin-top: 18px; }
#safe {
	position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

			const w = 21 * press * (0.92 + 0.08 * Math.sin(u * 43));
			top.push([x, 32 - w + Math.sin(u * 11) * 1.6]);
			bot.push([x, 32 + w + Math.sin(u * 7 + 1) * 1.6]);
		}
		const pts = top.concat(bot.reverse());
		const d = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
		document.getElementById('ghost').setAttribute('d', d);
		document.getElementById('ink').setAttribute('d', d);
	}());

	let shown = 0;
	function setProgress(p) {
		shown = Math.max(shown, Math.min(100, p));
		const w = 600 * shown / 100;
		wet.setAttribute('x', (600 - w).toFixed(1));
		wet.setAttribute('width', w.toFixed(1));
		tip.setAttribute('cx', (600 - w).toFixed(1));
		tip.setAttribute('r', shown > 0 && shown < 100 ? '7' : '0');
		pct.textContent = Math.round(shown) + '%';
	}

	function fail(err) {
		console.error(err);
		sub.textContent = 'تعذّر تشغيل اللعبة على هذا المتصفح';
		document.getElementById('brush').style.display = 'none';
		pct.style.display = 'none';
		document.getElementById('story').style.display = 'none';
		notice.style.display = 'block';
		notice.innerHTML = 'افتح الصفحة في Chrome أو Safari حديث، أو جرّب <a href="lite/">النسخة الخفيفة</a>.';
	}

	// ---- v6.2: sideways play on phones -------------------------------------------------
	// Test switches: ?rotate=1 / ?rotate=0 force the card on or off, ?fs=0 never asks for
	// full screen, ?safe=L,T,R,B pretends there is a notch (CSS px).
	const q = new URLSearchParams(location.search);
	const rotateEl = document.getElementById('rotate');
	const safeEl = document.getElementById('safe');
	const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
	const isPhone = coarse || (navigator.maxTouchPoints > 0 && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));
	let rotateOn = false;
	// In-app browsers (Instagram, Facebook, TikTok, Snapchat...) keep the page upright and
	// never rotate it, so the card must never trap the player there.
	const ua = navigator.userAgent || '';
	const inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|TikTok|Bytedance|Snapchat|Twitter|Line\//i.test(ua) || q.get('inapp') === '1';
	const isAndroid = /Android/i.test(ua);
	let playUpright = false;
	try { playUpright = sessionStorage.getItem('ink_upright') === '1'; } catch (e) {}
	(function setupCard() {
		const msg = document.getElementById('rotmsg');
		const ext = document.getElementById('openext');
		const up = document.getElementById('playup');
		const here = location.href.split('#')[0];
		if (inApp) {
			if (isAndroid) {
				msg.textContent = 'متصفح التطبيق ما يقلب الشاشة. افتح اللعبة في Chrome وتنقلب بالعرض، أو العبها بالطول من هنا.';
				ext.href = 'intent://' + here.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';
			} else {
				msg.textContent = 'متصفح التطبيق ما يقلب الشاشة. اضغط ⋯ فوق ثم «فتح في المتصفح»، أو العبها بالطول من هنا.';
				ext.hidden = true;
			}
		} else {
			ext.hidden = true;
		}
		function stay(ev) {
			if (ev) { ev.preventDefault(); ev.stopPropagation(); }
			playUpright = true;
			try { sessionStorage.setItem('ink_upright', '1'); } catch (e) {}
			checkRotate();
		}
		up.addEventListener('click', stay);
		up.addEventListener('touchend', stay);
		ext.addEventListener('touchend', function (ev) { ev.stopPropagation(); }, { passive: true });
		ext.addEventListener('click', function (ev) { ev.stopPropagation(); });
	}());
	function checkRotate() {
		const upright = window.innerHeight > window.innerWidth;
		const force = q.get('rotate');
		rotateOn = force === '1' ? upright : (force === '0' ? false : (isPhone && upright && !playUpright));
		rotateEl.classList.toggle('on', rotateOn);
	}
	window.addEventListener('resize', checkRotate);
	window.addEventListener('orientationchange', checkRotate);
	if (window.screen && screen.orientation && screen.orientation.addEventListener) {
		screen.orientation.addEventListener('change', checkRotate);
	}
	checkRotate();

	// Read by the game a few times a second: notch margins (CSS px), the window height they
	// are measured against, and whether the card above is showing.
	window.inkState = function () {
		let m = [0, 0, 0, 0];
		const fake = q.get('safe');
		if (fake) {
			m = fake.split(',').map(Number);
		} else {
			const cs = getComputedStyle(safeEl);
			m = [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom].map((v) => parseFloat(v) || 0);
		}
		return [m[0], m[1], m[2], m[3], window.innerHeight, rotateOn ? 1 : 0].join(',');
	};

	// Full screen, then lock the screen sideways. Browsers only allow this inside a tap, so
	// it rides on the first tap (the game's own tap-to-start card) and on every tap on the
	// rotate card. Android Chrome does both; iOS Safari has neither, hence the card.
	function lockWide() {
		try {
			const o = window.screen && screen.orientation;
			if (o && o.lock) {
				const p = o.lock('landscape');
				if (p && p.catch) { p.catch(function () {}); }
			}
		} catch (e) { /* not supported */ }
	}
	function goWide() {
		if (q.get('fs') === '0') { return; }
		const el = document.documentElement;
		const req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (!req) { return; }
		if (document.fullscreenElement || document.webkitFullscreenElement) { lockWide(); return; }
		try {
			const p = req.call(el, { navigationUI: 'hide' });
			if (p && p.then) { p.then(lockWide, function () {}); } else { lockWide(); }
		} catch (e) { /* not allowed here */ }
	}
	let asked = false;
	function firstTap() {
		if (asked || !isPhone) { return; }
		asked = true;
		goWide();
	}
	document.addEventListener('touchend', firstTap, { capture: true, passive: true });
	document.addEventListener('click', firstTap, { capture: true, passive: true });
	rotateEl.addEventListener('touchend', goWide, { passive: true });
	rotateEl.addEventListener('click', goWide);

	// Long-press menus and pinch zoom would break the touch controls.
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('gesturestart', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(missing.join(', '));
		return;
	}
	// Dev switches for testing: ?dev=--stage=3,--log (same switches as the desktop build).
	const dev = new URLSearchParams(location.search).get('dev');
	engine.startGame({
		'args': dev ? dev.split(',') : [],
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				setProgress(current / total * 100);
			}
		},
	}).then(() => {
		// The game's first frame is its own tap-to-start card on the same paper; that tap, on
		// the canvas, is what lets the browser play sound. Nothing here needs a tap.
		setProgress(100);
		statusOverlay.classList.add('done');
		setTimeout(() => statusOverlay.remove(), 400);
	}, fail);
}());
		</script>
	</body>
</html>

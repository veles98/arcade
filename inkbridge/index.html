<!DOCTYPE html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#eee7d6">
		<meta property="og:title" content="جسر الحبر">
		<meta property="og:description" content="لعبة مبارزة بالحبر: رونين، جسر، وظلّ ساموراي. تنلعب من الجوال بدون تحميل.">
		<title>جسر الحبر</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { height: 100%; }
body {
	color: #121113;
	background-color: #eee7d6;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background-color: #eee7d6;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	gap: 18px; text-align: center; padding: 24px;
}
#sun { width: 120px; height: 120px; border-radius: 50%; background: #c8200f; opacity: .92; margin-bottom: 6px; }
#title { font-size: 44px; font-weight: 900; letter-spacing: 0; margin: 0; }
#sub { font-size: 17px; opacity: .75; margin: 0; }
#bar { width: min(70vw, 320px); height: 10px; border-radius: 6px; background: rgba(18,17,19,.14); overflow: hidden; }
#fill { width: 0%; height: 100%; background: #c8200f; transition: width .2s; }
#pct { font-size: 15px; opacity: .7; direction: ltr; }
#notice { display: none; font-size: 16px; line-height: 1.7; max-width: 420px; }
#notice a { color: #c8200f; font-weight: 700; }
#how { font-size: 15px; opacity: .7; line-height: 1.8; margin-top: 4px; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<script src="../counter.js" defer></script>
	</head>
	<body>
		<canvas id="canvas">متصفحك لا يدعم هذه اللعبة.</canvas>
		<noscript>شغّل JavaScript لتلعب.</noscript>

		<div id="status">
			<div id="sun"></div>
			<h1 id="title">جسر الحبر</h1>
			<p id="sub">جارٍ تحضير الحبر…</p>
			<div id="bar"><div id="fill"></div></div>
			<div id="pct">0%</div>
			<p id="how">اسحب بإبهامك الأيسر لتتحرك · الزر الأحمر يضرب · الزر الأسود يندفع</p>
			<div id="notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8150872,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const fill = document.getElementById('fill');
	const pct = document.getElementById('pct');
	const notice = document.getElementById('notice');
	const sub = document.getElementById('sub');

	function fail(err) {
		console.error(err);
		sub.textContent = 'تعذّر تشغيل اللعبة على هذا المتصفح';
		document.getElementById('bar').style.display = 'none';
		pct.style.display = 'none';
		document.getElementById('how').style.display = 'none';
		notice.style.display = 'block';
		notice.innerHTML = 'افتح الصفحة في Chrome أو Safari حديث، أو جرّب <a href="lite/">النسخة الخفيفة</a>.';
	}

	// Long-press menus and pinch zoom would break the touch controls.
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('gesturestart', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(missing.join(', '));
		return;
	}
	// Dev switches for testing: ?dev=--section=3,--log (same switches as the desktop build).
	const dev = new URLSearchParams(location.search).get('dev');
	engine.startGame({
		'args': dev ? dev.split(',') : [],
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const p = Math.min(100, Math.round(current / total * 100));
				fill.style.width = p + '%';
				pct.textContent = p + '%';
			}
		},
	}).then(() => {
		statusOverlay.remove();
	}, fail);
}());
		</script>
	</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!--theme-init--><script>/*theme-init*/(function(){var d=document,r=d.documentElement,K='anas_theme',L=[['paper','ورق','#f3efe6','#0b0b0d','11,11,13','linear-gradient(135deg,#f3efe6 50%,#d9b766 50%)'],['night','ليل ذهبي','#07070a','#050507','5,5,7','linear-gradient(135deg,#0b0b10 50%,#f3c766 50%)'],['lake','بحيرة','#f7d6dc','#1f1233','31,18,51','linear-gradient(135deg,#ffc4b0 40%,#f4a6c8 40% 70%,#b7a2f0 70%)'],['neon','نيون','#070a1c','#050a1f','5,10,31','linear-gradient(135deg,#0a1030 40%,#19e1ff 40% 70%,#ff3da8 70%)'],['ink','حبر','#ffffff','#000000','0,0,0','linear-gradient(135deg,#fff 50%,#000 50%)']];function find(i){for(var k=0;k<L.length;k++)if(L[k][0]===i)return L[k]}function apply(i,save){var t=find(i)||L[0],m;r.dataset.theme=t[0];r.style.setProperty('--stage',t[3]);r.style.setProperty('--stage-rgb',t[4]);m=d.querySelector('meta[name=theme-color]');if(!m){m=d.createElement('meta');m.name='theme-color';d.head.appendChild(m)}m.content=t[2];if(save){try{localStorage.setItem(K,t[0])}catch(e){}}return t[0]}var s;try{s=new URLSearchParams(location.search).get('theme')||localStorage.getItem(K)}catch(e){}s={dark:'night',light:'paper'}[s]||s;window.ANAS_THEMES=L;window.ANAS_APPLY_THEME=function(i){return apply(i,false)};window.ANAS_SET_THEME=function(i){return apply(i,true)};apply(s)})();</script><!--/theme-init-->
<title>زحمة طريق الملك فهد</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--stage, #050507);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, Tahoma, sans-serif; color: #f5f2ea;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #score {
    position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none; display: none;
    font-size: 54px; font-weight: 800; color: #f3c766; text-shadow: 0 0 18px rgba(243,199,102,.75);
    transition: transform .12s ease-out;
  }
  #score.pop { transform: scale(1.3); }
  #bestTop { position: fixed; top: 82px; left: 0; right: 0; text-align: center; font-size: 16px; color: rgba(245,242,234,.65); pointer-events: none; display: none; }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; background: rgba(var(--stage-rgb,5,5,7),.6);
  }
  .hidden { display: none !important; }
  h1 { font-size: clamp(26px, 8vw, 44px); line-height: 1.3; color: #f3c766; text-shadow: 0 0 24px rgba(243,199,102,.75); }
  .sub { font-size: clamp(16px, 4.2vw, 20px); line-height: 1.6; color: rgba(245,242,234,.85); }
  .big { font-size: clamp(48px, 14vw, 64px); font-weight: 800; color: #f3c766; text-shadow: 0 0 22px rgba(243,199,102,.7); }
  .rec { font-size: 24px; font-weight: 700; color: #fff3c4; text-shadow: 0 0 16px rgba(243,199,102,.9); }
  button.main {
    min-height: 64px; min-width: 220px; padding: 12px 34px; border-radius: 34px; border: 2px solid #f3c766;
    background: rgba(243,199,102,.14); color: #f3c766; font-size: 26px; font-weight: 800; font-family: inherit; cursor: pointer;
    box-shadow: 0 0 22px rgba(243,199,102,.45), inset 0 0 14px rgba(243,199,102,.15);
  }
  button.main:disabled { opacity: .4; }
  #mute {
    position: fixed; top: 14px; left: 14px; width: 48px; height: 48px; border-radius: 50%; z-index: 5;
    border: 1.5px solid rgba(243,199,102,.6); background: rgba(var(--stage-rgb,5,5,7),.6); color: #f3c766; font-size: 20px; font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="bestTop"></div>
<button id="mute" aria-label="كتم الصوت">♪</button>

<div id="startScreen" class="screen">
  <h1>زحمة طريق الملك فهد</h1>
  <div class="sub">المس يمين الشاشة أو يسارها عشان تغيّر المسار<br>كل سيارة تتعداها = نقطة</div>
  <button class="main" id="startBtn">ابدأ</button>
</div>

<div id="overScreen" class="screen hidden">
  <h1>صدمت!</h1>
  <div class="sub">نتيجتك</div>
  <div class="big" id="finalScore">0</div>
  <div class="rec hidden" id="newRec">رقم قياسي جديد!</div>
  <div class="sub" id="bestLine">أفضل نتيجة: 0</div>
  <button class="main" id="againBtn">العب مرة ثانية</button>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let roadX = 0, roadW = 0, laneW = 0;
  const LANES = 3;

  const scoreEl = document.getElementById('score');
  const bestTop = document.getElementById('bestTop');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScore = document.getElementById('finalScore');
  const newRec = document.getElementById('newRec');
  const bestLine = document.getElementById('bestLine');
  const againBtn = document.getElementById('againBtn');
  const muteBtn = document.getElementById('mute');

  // ---------- الحالة ----------
  let state = 'start';
  let score = 0, time = 0, speed = 0, shake = 0, scroll = 0, nextRow = 0;
  let traffic = [], particles = [], buildings = [], lamps = [];
  const player = { lane: 1, x: 0, fromX: 0, toX: 0, t: 1, y: 0, w: 0, h: 0, tilt: 0 };
  const MOVE_TIME = 0.14; // زمن تغيير المسار

  function laneX(i) { return roadX + laneW * (i + 0.5); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    roadW = Math.min(W * 0.74, H * 0.5);
    roadX = (W - roadW) / 2;
    laneW = roadW / LANES;
    player.w = laneW * 0.56; player.h = player.w * 1.9;
    player.y = H * 0.8;
    player.x = player.toX = player.fromX = laneX(player.lane);
    buildCity();
  }

  // ---------- أفضل نتيجة ----------
  const BEST_KEY = 'king_fahd_road_best';
  let memBest = 0;
  function loadBest() { try { const v = parseInt(localStorage.getItem(BEST_KEY), 10); return isNaN(v) ? memBest : v; } catch (e) { return memBest; } }
  function saveBest(v) { memBest = v; try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }
  let best = loadBest();

  // ---------- الصوت ----------
  let audio = null, muted = false;
  function initAudio() {
    if (audio) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); } catch (e) { audio = null; }
  }
  function tone(f1, f2, dur, type, vol) {
    if (!audio || muted) return;
    try {
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    move: () => tone(420, 520, 0.07, 'triangle', 0.05),
    point: () => tone(900, 1350, 0.1, 'sine', 0.07),
    crash: () => { tone(160, 40, 0.5, 'sawtooth', 0.14); tone(90, 30, 0.6, 'square', 0.06); }
  };

  // ---------- المدينة على الجانبين ----------
  function buildCity() {
    buildings = []; lamps = [];
    const side = roadX;
    for (let k = 0; k < 2; k++) {
      let y = -H;
      while (y < H * 2) {
        const h = H * (0.08 + Math.random() * 0.12);
        const w = side * (0.55 + Math.random() * 0.4);
        buildings.push({ side: k, y, h, w, seed: Math.random() * 1000, tall: Math.random() < 0.15 });
        y += h + H * 0.02;
      }
    }
    for (let y = -H; y < H * 2; y += H * 0.18) { lamps.push({ y, side: 0 }); lamps.push({ y: y + H * 0.09, side: 1 }); }
  }

  // ---------- السيارات ----------
  const TRAFFIC_REL = 0.45; // كل السيارات بنفس السرعة عشان ما تلحق بعض وتسكّر الطريق كله
  const COLORS = ['#e8e8ee', '#e0453a', '#3d84f0', '#9aa0ab', '#d9d0b8', '#38c3b0'];

  let lastFree = 1;
  function spawnRow() {
    // مسار مفتوح دائمًا، وقريب من المسار المفتوح في الصف اللي قبله
    const freeOptions = [lastFree - 1, lastFree, lastFree + 1].filter(l => l >= 0 && l < LANES);
    const free = freeOptions[Math.floor(Math.random() * freeOptions.length)];
    const others = [0, 1, 2].filter(l => l !== free);
    const blockCount = time < 6 ? 1 : (Math.random() < Math.min(0.6, 0.15 + time / 70) ? 2 : 1);
    const lanes = blockCount === 2 ? others : [others[Math.floor(Math.random() * others.length)]];
    lastFree = free;
    const row = { cars: [], passed: false };
    let maxH = 0;
    for (const l of lanes) {
      const w = laneW * (0.52 + Math.random() * 0.06);
      const big = Math.random() < 0.18;
      const h = big ? w * 2.8 : w * 1.9;
      maxH = Math.max(maxH, h);
      const car = { lane: l, x: laneX(l), y: -h / 2 - 10, w: big ? w * 1.1 : w, h, color: big ? '#b9a27a' : COLORS[Math.floor(Math.random() * COLORS.length)], rel: TRAFFIC_REL, big, row };
      traffic.push(car); row.cars.push(car);
    }
    // العدالة بالوقت: السيارات تقرب منك بالسرعة النسبية، ولازم تلحق تنتقل مسارين + 0.3 ثانية
    const vRel = speed * (1 - TRAFFIC_REL);
    const needTime = (player.h + maxH) / vRel + MOVE_TIME * 2 + 0.3;
    const easy = time < 6 ? 1.6 : 1;
    nextRow = needTime * easy * (1 + Math.random() * 0.5);   // بالثواني
  }

  function burst(x, y, n, color, spread) {
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * spread, vy: (Math.random() - 0.5) * spread, t: 0, life: 0.4 + Math.random() * 0.4, color, r: 1.5 + Math.random() * 2.5 });
  }

  // ---------- اللعب ----------
  function reset() {
    score = 0; time = 0; shake = 0; traffic = []; particles = [];
    speed = H * 0.75; nextRow = 0.6; lastFree = 1;
    player.lane = 1; player.x = player.toX = player.fromX = laneX(1); player.t = 1; player.tilt = 0;
    scoreEl.textContent = '0';
  }
  function startGame() {
    reset(); state = 'play';
    startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
    scoreEl.style.display = 'block'; bestTop.style.display = 'block';
    bestTop.textContent = 'أفضل نتيجة: ' + best;
  }
  function move(dir) {
    const nl = Math.max(0, Math.min(LANES - 1, player.lane + dir));
    if (nl === player.lane) return;
    player.lane = nl; player.fromX = player.x; player.toX = laneX(nl); player.t = 0; player.tilt = dir;
    sfx.move();
  }
  function gameOver() {
    state = 'over'; shake = 0.45; sfx.crash();
    burst(player.x, player.y - player.h * 0.3, 30, 'rgba(243,199,102,1)', 520);
    const isRec = score > best;
    if (isRec) { best = score; saveBest(best); }
    finalScore.textContent = score; bestLine.textContent = 'أفضل نتيجة: ' + best;
    newRec.classList.toggle('hidden', !isRec);
    againBtn.disabled = true;
    setTimeout(() => { overScreen.classList.remove('hidden'); setTimeout(() => { againBtn.disabled = false; }, 600); }, 450);
  }

  // ---------- الإدخال ----------
  function press(x) {
    initAudio();
    if (audio && audio.state === 'suspended') audio.resume();
    if (state === 'start') { startGame(); return; }
    if (state === 'play') move(x > W / 2 ? 1 : -1);
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault(); press(e.clientX);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') { e.preventDefault(); if (state === 'play') move(-1); else if (state === 'start') press(W); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); if (state === 'play') move(1); else if (state === 'start') press(W); }
    else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state === 'over') { if (!againBtn.disabled) startGame(); } else if (state === 'start') press(W); }
  });
  document.getElementById('startBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); press(W); });
  againBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!againBtn.disabled) { initAudio(); startGame(); } });
  muteBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '×' : '♪'; });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  let paused = false;
  document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

  // ---------- التحديث ----------
  function update(dt) {
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.t < p.life);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (state !== 'play') { scroll += H * 0.15 * dt; return; }

    time += dt;
    const ramp = time < 5 ? 0 : Math.min(1, (time - 5) / 60);
    speed = H * (0.75 + 0.85 * ramp);
    scroll += speed * dt;

    // حركة اللاعب
    if (player.t < 1) {
      player.t = Math.min(1, player.t + dt / MOVE_TIME);
      const e = 1 - Math.pow(1 - player.t, 3);
      player.x = player.fromX + (player.toX - player.fromX) * e;
    }
    player.tilt *= Math.pow(0.0005, dt);

    // السيارات
    nextRow -= dt;
    if (nextRow <= 0) spawnRow();
    for (const c of traffic) c.y += speed * (1 - c.rel) * dt;
    traffic = traffic.filter(c => c.y - c.h < H + 40);

    const px1 = player.x - player.w * 0.4, px2 = player.x + player.w * 0.4, py1 = player.y - player.h * 0.4, py2 = player.y + player.h * 0.4;
    for (const c of traffic) {
      const cx1 = c.x - c.w * 0.4, cx2 = c.x + c.w * 0.4, cy1 = c.y - c.h * 0.4, cy2 = c.y + c.h * 0.4;
      if (px2 > cx1 && px1 < cx2 && py2 > cy1 && py1 < cy2) { gameOver(); return; }
      if (!c.row.passed && c.y - c.h / 2 > player.y + player.h / 2) {
        c.row.passed = true; score += c.row.cars.length;
        scoreEl.textContent = score;
        scoreEl.classList.add('pop'); setTimeout(() => scoreEl.classList.remove('pop'), 120);
        burst(player.x, player.y - player.h / 2, 10, 'rgba(243,199,102,1)', 260);
        sfx.point();
      }
    }
  }

  // ---------- الرسم ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function drawCity() {
    ctx.fillStyle = '#07070b'; ctx.fillRect(0, 0, W, H);
    const span = H * 3;
    for (const b of buildings) {
      const y = ((b.y + scroll * 0.55) % span + span) % span - H;
      if (y > H || y + b.h < 0) continue;
      const x = b.side === 0 ? roadX - b.w - 10 : roadX + roadW + 10;
      ctx.fillStyle = b.tall ? '#1a1520' : '#121218';
      rr(x, y, b.w, b.h, 4); ctx.fill();
      ctx.strokeStyle = b.tall ? 'rgba(243,199,102,0.5)' : 'rgba(245,242,234,0.08)'; ctx.lineWidth = 1.2; ctx.stroke();
      // نوافذ مضيئة
      const cols = Math.max(2, Math.floor(b.w / 14)), rows = Math.max(2, Math.floor(b.h / 16));
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        const v = Math.sin(b.seed + i * 12.9 + j * 78.2) * 43758.5; const r = v - Math.floor(v);
        if (r > 0.55) { ctx.fillStyle = r > 0.9 ? 'rgba(243,199,102,0.9)' : 'rgba(243,199,102,0.35)'; ctx.fillRect(x + 5 + i * (b.w - 10) / cols, y + 5 + j * (b.h - 10) / rows, 4, 5); }
      }
    }
  }

  function drawRoad() {
    ctx.fillStyle = '#16161c'; ctx.fillRect(roadX, 0, roadW, H);
    // حواف ذهبية
    ctx.save(); ctx.strokeStyle = '#f3c766'; ctx.lineWidth = 3; ctx.shadowColor = '#f3c766'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(roadX, 0); ctx.lineTo(roadX, H); ctx.moveTo(roadX + roadW, 0); ctx.lineTo(roadX + roadW, H); ctx.stroke(); ctx.restore();
    // خطوط المسارات
    const dash = H * 0.07, gap = H * 0.06, off = scroll % (dash + gap);
    ctx.fillStyle = 'rgba(245,242,234,0.55)';
    for (let i = 1; i < LANES; i++) {
      const x = roadX + laneW * i - 2;
      for (let y = -dash + off; y < H; y += dash + gap) ctx.fillRect(x, y, 4, dash);
    }
    // أعمدة إنارة
    const span = H * 3;
    for (const l of lamps) {
      const y = ((l.y + scroll) % span + span) % span - H;
      if (y < -40 || y > H + 40) continue;
      const x = l.side === 0 ? roadX - 6 : roadX + roadW + 6;
      const g = ctx.createRadialGradient(x, y, 0, x, y, laneW * 0.9);
      g.addColorStop(0, 'rgba(243,199,102,0.28)'); g.addColorStop(1, 'rgba(243,199,102,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, laneW * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCar(x, y, w, h, color, isPlayer, tilt, big) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * 0.12);
    if (isPlayer) { ctx.shadowColor = 'rgba(243,199,102,0.9)'; ctx.shadowBlur = 22; }
    ctx.fillStyle = color; rr(-w / 2, -h / 2, w, h, w * 0.22); ctx.fill();
    ctx.shadowBlur = 0;
    if (big) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-w * 0.4, -h * 0.3, w * 0.8, h * 0.72);
      ctx.fillStyle = '#1b2733'; rr(-w * 0.38, -h * 0.47, w * 0.76, h * 0.14, 4); ctx.fill();
    } else {
      ctx.fillStyle = '#1b2733';
      rr(-w * 0.36, -h * 0.28, w * 0.72, h * 0.2, 5); ctx.fill();      // الزجاج الأمامي
      rr(-w * 0.34, h * 0.14, w * 0.68, h * 0.14, 5); ctx.fill();      // الزجاج الخلفي
      ctx.fillStyle = isPlayer ? '#e0b04f' : 'rgba(255,255,255,0.12)';
      rr(-w * 0.34, -h * 0.07, w * 0.68, h * 0.2, 4); ctx.fill();       // السقف
    }
    if (isPlayer) {
      // أضواء أمامية
      const g = ctx.createLinearGradient(0, -h / 2, 0, -h * 1.4);
      g.addColorStop(0, 'rgba(255,243,196,0.35)'); g.addColorStop(1, 'rgba(255,243,196,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-w * 0.4, -h / 2); ctx.lineTo(w * 0.4, -h / 2); ctx.lineTo(w * 0.9, -h * 1.4); ctx.lineTo(-w * 0.9, -h * 1.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3c4'; ctx.fillRect(-w * 0.4, -h / 2 + 2, w * 0.18, 4); ctx.fillRect(w * 0.22, -h / 2 + 2, w * 0.18, 4);
    } else {
      // أضواء خلفية حمراء (السيارات قدامك)
      ctx.save(); ctx.shadowColor = '#ff3b30'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff4b3e';
      ctx.fillRect(-w * 0.42, h / 2 - 6, w * 0.2, 4); ctx.fillRect(w * 0.22, h / 2 - 6, w * 0.2, 4); ctx.restore();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) { const m = shake * 24; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    drawCity(); drawRoad();
    for (const c of traffic) drawCar(c.x, c.y, c.w, c.h, c.color, false, 0, c.big);
    drawCar(player.x, player.y, player.w, player.h, '#f3c766', true, player.tilt, false);
    for (const p of particles) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- الحلقة ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 0.05);
    if (!paused) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
